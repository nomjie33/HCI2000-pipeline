# Publish prototype/ to GitHub Pages so the study phone can install it as an offline app.
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Runs on every push to main that touches prototype/, or manually (Actions tab -> Deploy prototype -> Run workflow).
name: Deploy prototype

on:
  push:
    branches: [main]
    paths: ["prototype/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototype
      - id: deployment
        uses: actions/deploy-pages@v4
